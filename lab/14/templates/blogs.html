{% extends 'base.html' %}
{% block page_title %}All Blogs{% endblock %}
{% block title %}All Blogs{% endblock %}
{% block content %}
{% for blog in blogs %}
<div class="blog-seperator"> 
    <h3>{{blog[2]}}</h3>
    <p><strong>By: {{blog[1]}}</strong></p>
    <p>{{blog[3]}}</p>
    <p><em>Posted on {{blog[4]}}</em></p>
</div>
{% endfor %}
{% endblock %}
