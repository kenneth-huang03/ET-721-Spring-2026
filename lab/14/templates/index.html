{% extends 'base.html' %}
{% block page_title %}My Blog{% endblock %}
{% block title %}Kenneth Huang{% endblock %}
{% block content %}
<h2 class="subtitle">Create a blog</h2>
<form action="/ET721/add_blog" method="POST">
    <input type="text" name="username" placeholder="Enter username" required>
    <input type="email" name="email" placeholder="Enter email" required>
    <input type="text" name="title" placeholder="Blog Title">
    <textarea name="content" placeholder="Write your blog..." required></textarea>
    <button type="submit">Post</button>
</form>
{% endblock %}
